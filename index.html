<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Global Voice Reminder App</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-top: 0; color: #3b82f6; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #a3a3a3; font-size: 14px; }
        
        input[type="text"], input[type="password"], input[type="datetime-local"], select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #2a2a2a;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }
        
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add { background-color: #2563eb; color: white; }
        .btn-add:hover { background-color: #1d4ed8; }
        .btn-voice { background-color: #dc2626; color: white; position: relative; }
        .btn-voice:hover { background-color: #b91c1c; }
        .btn-voice.recording { background-color: #ef4444; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        
        #status { text-align: center; color: #3b82f6; font-style: italic; margin: 10px 0; min-height: 20px; font-weight: 500; }
        
        .reminder-list { margin-top: 25px; }
        .reminder-item {
            background: #2d2d2d;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #3b82f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .reminder-item.triggered { border-left-color: #10b981; opacity: 0.7; }
        .task-text { font-weight: 500; }
        .task-time { font-size: 12px; color: #a3a3a3; margin-top: 4px; }
        .btn-delete { background: none; color: #ef4444; border: none; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>⏰ AI Voice Reminder (Multi-Language)</h2>
    
    <!-- API Key Input -->
    <div class="input-group">
        <label for="apiKeyInput">🔑 Enter Gemini API Key</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
    </div>

    <!-- Text Input Form -->
    <div class="input-group">
        <label for="taskInput">Reminder Command</label>
        <input type="text" id="taskInput" placeholder="Type or click Speak to record in any language...">
    </div>
    
    <div class="input-group">
        <label for="timeInput">Set Trigger Time</label>
        <input type="datetime-local" id="timeInput">
    </div>
    
    <div class="btn-row">
        <button class="btn-add" id="addBtn">Save Reminder</button>
        <button class="btn-voice" id="voiceBtn">🎙️ Speak (Click to Start/Stop)</button>
    </div>
    
    <p id="status"></p>
    
    <!-- Display list -->
    <div class="reminder-list" id="listContainer">
        <h3 style="border-bottom: 1px solid #333; padding-bottom: 8px; color: #a3a3a3;">Active Reminders</h3>
        <div id="remindersDiv"></div>
    </div>
</div>

<script type="module">
    // Import Google Gen AI Library directly in the browser
    import { GoogleGenAI } from 'https://esm.run/@google/genai';

    const taskInput = document.getElementById('taskInput');
    const timeInput = document.getElementById('timeInput');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const addBtn = document.getElementById('addBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const status = document.getElementById('status');
    const remindersDiv = document.getElementById('remindersDiv');

    let reminders = JSON.parse(localStorage.getItem('ai_reminders')) || [];
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    // Load saved API key if available
    if (localStorage.getItem('gemini_api_key')) {
        apiKeyInput.value = localStorage.getItem('gemini_api_key');
    }

    if (Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    function setDefaultTime() {
        const now = new Date();
        now.setMinutes(now.getMinutes() + 5);
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        timeInput.value = now.toISOString().slice(0, 16);
    }
    setDefaultTime();

    // Native High-Fidelity Audio Recording Framework
    voiceBtn.addEventListener('click', async () => {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
            alert("Please enter a valid Gemini API key first.");
            return;
        }
        localStorage.setItem('gemini_api_key', apiKey);

        if (!isRecording) {
            // Start Audio capture
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    status.innerText = "Processing audio with AI Engine...";
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await processAudioWithGemini(audioBlob, apiKey);
                };

                mediaRecorder.start();
                isRecording = true;
                voiceBtn.classList.add('recording');
                voiceBtn.innerText = "🛑 Stop Recording";
                status.innerText = "Listening closely... Speak now (Urdu, English, etc.)";
            } catch (err) {
                status.innerText = "Microphone access denied.";
                console.error(err);
            }
        } else {
            // Stop Audio capture
            mediaRecorder.stop();
            // Stop all tracks on the stream to release mic access hardware
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            isRecording = false;
            voiceBtn.classList.remove('recording');
            voiceBtn.innerText = "🎙️ Speak (Click to Start/Stop)";
        }
    });

    // Send Audio payload directly to Gemini API
    async function processAudioWithGemini(audioBlob, apiKey) {
        try {
            // Convert blob file payload to base64
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = async () => {
                const base64Audio = reader.result.split(',')[1];

                const ai = new GoogleGenAI({ apiKey: apiKey });
                
                // Call gemini-2.5-flash with the raw audio signature data input
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: [
                        {
                            role: 'user',
                            parts: [
                                {
                                    inlineData: {
                                        mimeType: 'audio/webm',
                                        data: base64Audio
                                    }
                                },
                                {
                                    text: "Listen to this audio file carefully. Transcribe the spoken text accurately into its native text format. If spoken in Urdu, output the text in Urdu script. Return ONLY the transcribed text translation with no conversational responses."
                                }
                            ]
                        }
                    ]
                });

                taskInput.value = response.text.trim();
                status.innerText = "Speech captured accurately!";
            };
        } catch (error) {
            status.innerText = "AI processing failed.";
            console.error(error);
        }
    }

    // Save Reminder Schedule
    addBtn.addEventListener('click', () => {
        const text = taskInput.value.trim();
        const targetTime = new Date(timeInput.value).getTime();

        if (!text) {
            alert("Please type or speak a reminder description first.");
            return;
        }
        if (isNaN(targetTime) || targetTime <= Date.now()) {
            alert("Please choose a valid time in the future.");
            return;
        }

        const reminder = {
            id: Date.now(),
            task: text,
            triggerAt: targetTime,
            triggered: false
        };

        reminders.push(reminder);
        saveAndRender();
        taskInput.value = "";
        setDefaultTime();
        status.innerText = "Reminder locked into timeline!";
    });

    window.deleteReminder = (id) => {
        reminders = reminders.filter(r => r.id !== id);
        saveAndRender();
    };

    function saveAndRender() {
        localStorage.setItem('ai_reminders', JSON.stringify(reminders));
        reminders.sort((a, b) => a.triggerAt - b.triggerAt);
        
        remindersDiv.innerHTML = "";
        if (reminders.length === 0) {
            remindersDiv.innerHTML = '<p style="color:#666; text-align:center;">No active reminders set.</p>';
            return;
        }

        reminders.forEach(r => {
            const timeString = new Date(r.triggerAt).toLocaleString();
            const div = document.createElement('div');
            div.className = `reminder-item ${r.triggered ? 'triggered' : ''}`;
            div.innerHTML = `
                <div>
                    <div class="task-text">${r.task}</div>
                    <div class="task-time">📅 ${timeString} ${r.triggered ? '(Done)' : ''}</div>
                </div>
                <button class="btn-delete" onclick="deleteReminder(${r.id})">🗑️</button>
            `;
            remindersDiv.appendChild(div);
        });
    }

    // Polling Engine (Evaluates timestamp schedules every 1 second)
    setInterval(() => {
        let changed = false;
        const now = Date.now();

        reminders.forEach(r => {
            if (!r.triggered && now >= r.triggerAt) {
                r.triggered = true;
                changed = true;

                // Tone Generator Alert
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
                oscillator.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 1.5); 

                // OS Banner Alert Window
                if (Notification.permission === "granted") {
                    new Notification("⏰ AI Reminder Alert!", {
                        body: r.task,
                        icon: "https://cdn-icons-png.flaticon.com/512/3602/3602145.png"
                    });
                } else {
                    alert(`🚨 REMINDER: ${r.task}`);
                }
            }
        });

        if (changed) {
            saveAndRender();
        }
    }, 1000);

    saveAndRender();
</script>

</body>
</html>
