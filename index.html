<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Universal Reminder System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --recording: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 { font-size: 1.5rem; margin-bottom: 24px; }

        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .btn-submit { background-color: var(--accent); color: white; }
        .btn-submit:hover { background-color: var(--accent-hover); }

        .btn-voice { background-color: #334155; color: white; }
        .btn-voice.recording { background-color: var(--recording); animation: pulse 1.5s infinite; }

        .status-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }
        .status-success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .status-loading { background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid #6366f1; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⏰ AI Universal Reminder Panel</h1>
    
    <textarea id="textPayload" placeholder="Type your reminder in any language... (e.g., 'Remind me to call the office in 10 minutes' or '10 minute baad paani peene ka yaad dilao')"></textarea>
    
    <div class="btn-group">
        <button type="button" id="voiceBtn" class="btn-voice">🎤 Record Voice</button>
        <button type="button" id="submitBtn" class="btn-submit">Set Reminder</button>
    </div>

    <div id="statusBox" class="status-box"></div>
</div>

<script>
    const WEBHOOK_URL = 'https://primary-production-4c58.up.railway.app/webhook/voice-reminder'; 
    
    const textPayload = document.getElementById('textPayload');
    const voiceBtn = document.getElementById('voiceBtn');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    // Show Custom UI Notifications
    function showStatus(message, type) {
        statusBox.style.display = 'block';
        statusBox.textContent = message;
        statusBox.className = `status-box status-${type}`;
    }

    // --- HANDLE TEXT SUBMISSION ---
    submitBtn.addEventListener('click', async () => {
        const text = textPayload.value.trim();
        if (!text) return alert('Please enter text first!');

        showStatus('Processing your reminder...', 'loading');

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    inputType: 'text',
                    textPayload: text
                })
            });

            if (response.ok) {
                showStatus('✓ Success! Your background reminder has been set.', 'success');
                textPayload.value = '';
            } else {
                throw new Error('Server returned an error');
            }
        } catch (err) {
            showStatus('❌ Failed to set reminder. Check n8n webhook connection.', 'recording');
        }
    });

    // --- HANDLE AUDIO RECORDING & MULTIPART VOICE SUBMISSION ---
    voiceBtn.addEventListener('click', async () => {
        if (!isRecording) {
            // Start Recording Voice
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    
                    // Package as standard Form Data multipart upload for webhooks
                    const formData = new FormData();
                    formData.append('inputType', 'voice');
                    formData.append('audioFile', audioBlob, 'recording.wav');

                    showStatus('Uploading voice note & transcribing language...', 'loading');

                    try {
                        const response = await fetch(WEBHOOK_URL, {
                            method: 'POST',
                            body: formData
                        });

                        if (response.ok) {
                            showStatus('✓ Success! Voice processed and reminder scheduled.', 'success');
                        } else {
                            throw new Error();
                        }
                    } catch (e) {
                        showStatus('❌ Voice upload failed.', 'recording');
                    }
                };

                mediaRecorder.start();
                isRecording = true;
                voiceBtn.textContent = '🛑 Stop Recording';
                voiceBtn.classList.add('recording');
            } catch (err) {
                alert('Microphone access denied or unsupported by browser.');
            }
        } else {
            // Stop Recording Voice
            mediaRecorder.stop();
            // Shut off microphone stream components cleanly
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            isRecording = false;
            voiceBtn.textContent = '🎤 Record Voice';
            voiceBtn.classList.remove('recording');
        }
    });
</script>

</body>
</html>
