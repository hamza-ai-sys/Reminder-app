<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Voice & Text Reminder App</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-top: 0; color: #3b82f6; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #a3a3a3; font-size: 14px; }
        
        input[type="text"], input[type="datetime-local"], select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #2a2a2a;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }
        
        select { cursor: pointer; }
        
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add { background-color: #2563eb; color: white; }
        .btn-add:hover { background-color: #1d4ed8; }
        .btn-voice { background-color: #dc2626; color: white; }
        .btn-voice:hover { background-color: #b91c1c; }
        
        #status { text-align: center; color: #e5e7eb; font-style: italic; margin: 10px 0; min-height: 20px; }
        
        .reminder-list { margin-top: 25px; }
        .reminder-item {
            background: #2d2d2d;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #3b82f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .reminder-item.triggered { border-left-color: #10b981; opacity: 0.7; }
        .task-text { font-weight: 500; }
        .task-time { font-size: 12px; color: #a3a3a3; margin-top: 4px; }
        .btn-delete { background: none; color: #ef4444; border: none; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>⏰ Global Voice Reminder</h2>
    
    <!-- Language Selection Dropdown -->
    <div class="input-group">
        <label for="langSelect">🗣️ Select Your Spoken Language</label>
        <select id="langSelect">
            <option value="en-US">English (US)</option>
            <option value="ur-PK">اردو (Pakistan)</option>
            <option value="hi-IN">हिन्दी (India)</option>
            <option value="ar-SA">العربية (Saudi Arabia)</option>
            <option value="es-ES">Español (España)</option>
            <option value="zh-CN">中文 (简体)</option>
        </select>
    </div>

    <!-- Text Input Form -->
    <div class="input-group">
        <label for="taskInput">What do you want to be reminded of?</label>
        <input type="text" id="taskInput" placeholder="Type here or use the microphone button...">
    </div>
    
    <div class="input-group">
        <label for="timeInput">Set Trigger Time</label>
        <input type="datetime-local" id="timeInput">
    </div>
    
    <div class="btn-row">
        <button class="btn-add" id="addBtn">Save Reminder</button>
        <button class="btn-voice" id="voiceBtn">🎙️ Speak Input</button>
    </div>
    
    <p id="status"></p>
    
    <!-- Display list -->
    <div class="reminder-list" id="listContainer">
        <h3 style="border-bottom: 1px solid #333; padding-bottom: 8px; color: #a3a3a3;">Active Reminders</h3>
        <div id="remindersDiv"></div>
    </div>
</div>

<script>
    const taskInput = document.getElementById('taskInput');
    const timeInput = document.getElementById('timeInput');
    const langSelect = document.getElementById('langSelect');
    const addBtn = document.getElementById('addBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const status = document.getElementById('status');
    const remindersDiv = document.getElementById('remindersDiv');

    let reminders = JSON.parse(localStorage.getItem('global_reminders')) || [];

    // Ensure desktop notifications are permitted
    if (Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    // Set default target execution window to +5 mins
    function setDefaultTime() {
        const now = new Date();
        now.setMinutes(now.getMinutes() + 5);
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        timeInput.value = now.toISOString().slice(0, 16);
    }
    setDefaultTime();

    // Native Speech API Configuration Hook
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        
        // Fired instantly when microphone is triggered
        voiceBtn.addEventListener('click', () => {
            // Bind the active profile to whatever language is selected right now
            recognition.lang = langSelect.value; 
            recognition.start();
            status.innerText = "Listening closely... Speak your command.";
        });

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            taskInput.value = transcript;
            status.innerText = "Speech captured successfully!";
        };

        recognition.onerror = (e) => { 
            status.innerText = "Listening failed. Make sure microphone permissions are granted."; 
            console.error(e);
        };
    } else {
        voiceBtn.innerHTML = "🎙️ Mic Not Supported";
        voiceBtn.disabled = true;
    }

    // Action Execution: Save to persistence profile
    addBtn.addEventListener('click', () => {
        const text = taskInput.value.trim();
        const targetTime = new Date(timeInput.value).getTime();

        if (!text) {
            alert("Please type or speak a reminder message first.");
            return;
        }
        if (isNaN(targetTime) || targetTime <= Date.now()) {
            alert("Please select a valid date/time in the future.");
            return;
        }

        const reminder = {
            id: Date.now(),
            task: text,
            triggerAt: targetTime,
            triggered: false
        };

        reminders.push(reminder);
        saveAndRender();
        taskInput.value = "";
        setDefaultTime();
        status.innerText = "Reminder locked into schedule!";
    });

    window.deleteReminder = (id) => {
        reminders = reminders.filter(r => r.id !== id);
        saveAndRender();
    };

    function saveAndRender() {
        localStorage.setItem('global_reminders', JSON.stringify(reminders));
        reminders.sort((a, b) => a.triggerAt - b.triggerAt);
        
        remindersDiv.innerHTML = "";
        if (reminders.length === 0) {
            remindersDiv.innerHTML = '<p style="color:#666; text-align:center;">No pending reminders.</p>';
            return;
        }

        reminders.forEach(r => {
            const timeString = new Date(r.triggerAt).toLocaleString();
            const div = document.createElement('div');
            div.className = `reminder-item ${r.triggered ? 'triggered' : ''}`;
            div.innerHTML = `
                <div>
                    <div class="task-text">${r.task}</div>
                    <div class="task-time">📅 ${timeString} ${r.triggered ? '(Triggered)' : ''}</div>
                </div>
                <button class="btn-delete" onclick="deleteReminder(${r.id})">🗑️</button>
            `;
            remindersDiv.appendChild(div);
        });
    }

    // Internal polling loop - evaluates parameters every 1 second
    setInterval(() => {
        let stateChanged = false;
        const now = Date.now();

        reminders.forEach(r => {
            if (!r.triggered && now >= r.triggerAt) {
                r.triggered = true;
                stateChanged = true;

                // Sound Alert Tone
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
                oscillator.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 1.2); 

                // Window Alert Notification Card
                if (Notification.permission === "granted") {
                    new Notification("⏰ Reminder Alert!", {
                        body: r.task,
                        icon: "https://cdn-icons-png.flaticon.com/512/3602/3602145.png"
                    });
                } else {
                    alert(`🔔 ALERT: ${r.task}`);
                }
            }
        });

        if (stateChanged) {
            saveAndRender();
        }
    }, 1000);

    saveAndRender();
</script>

</body>
</html>
