<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reminder Gateway</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
        h2 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        textarea { height: 100px; resize: none; }
        button { width: 100%; background: #ff6c5f; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #e05b50; }
        #response { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; }
        .success { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
        .error { background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
    </style>
</head>
<body>

<div class="card">
    <h2>Create New Reminder</h2>
    
    <div class="form-group">
        <label for="inputType">Input Type</label>
        <select id="inputType">
            <option value="text">Text Entry</option>
            <option value="voice">Voice Transcript</option>
        </select>
    </div>

    <div class="form-group">
        <label for="textPayload">Message Content</label>
        <textarea id="textPayload" placeholder="Type your reminder or paste voice notes..."></textarea>
    </div>

    <button id="submitBtn" onclick="sendReminder()">Send to Pipeline</button>
    <div id="response"></div>
</div>

<script>
    async function sendReminder() {
        const inputType = document.getElementById('inputType').value;
        const textPayload = document.getElementById('textPayload').value;
        const responseDiv = document.getElementById('response');
        const submitBtn = document.getElementById('submitBtn');

        if (!textPayload.trim()) {
            showResponse('Please enter some content first.', 'error');
            return;
        }

        // UI Feedback during request execution
        submitBtn.disabled = true;
        submitBtn.innerText = 'Processing...';
        responseDiv.style.display = 'none';

        // REPLACE THIS URL WITH YOUR ACTUAL N8N WEBHOOK TEST/PRODUCTION URL
        const N8N_WEBHOOK_URL = 'https://your-n8n-instance.com/webhook/voice-reminder';

        try {
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    inputType: inputType,
                    textPayload: textPayload
                })
            });

            if (response.ok) {
                const data = await response.json();
                showResponse('Success! Automation processed and logged to Discord.', 'success');
                document.getElementById('textPayload').value = ''; // Clear form
            } else {
                showResponse(`Server error status: ${response.status}`, 'error');
            }
        } catch (error) {
            showResponse(`Network Error: ${error.message}`, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Send to Pipeline';
        }
    }

    function showResponse(message, type) {
        const responseDiv = document.getElementById('response');
        responseDiv.innerText = message;
        responseDiv.className = type;
        responseDiv.style.display = 'block';
    }
</script>

</body>
</html>
