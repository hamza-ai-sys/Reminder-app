<script>
  // Dynamic endpoint switcher based on your current phase (Test vs. Live Production)
  const N8N_MODE = 'test'; // Change to 'production' when saving/activating the workflow permanently
  const BASE_URL = 'https://hamza-n8n.yourdomain.com'; // Replace with your actual n8n instance base URL
  
  const webhookUrl = N8N_MODE === 'test' 
    ? `${BASE_URL}/webhook-test/voice-reminder` 
    : `${BASE_URL}/webhook/voice-reminder`;

  // Main function to transmit data to n8n pipelines
  async function sendReminderPayload(inputType, payloadData) {
    try {
      const formData = new FormData();
      formData.append('inputType', inputType);

      if (inputType === 'text') {
        formData.append('textPayload', payloadData);
      } else if (inputType === 'voice') {
        // payloadData should be the recorded audio Blob object
        formData.append('audioFile', payloadData, 'recording.webm');
      }

      // We explicitly DO NOT set 'Content-Type' header here. 
      // Letting the browser automatically set the Multi-part Form boundary prevents CORS Preflight blocks.
      const response = await fetch(webhookUrl, {
        method: 'POST',
        mode: 'cors', 
        body: formData
      });

      if (!response.ok) {
        throw new Error(`Server returned status code ${response.status}`);
      }

      const result = await response.json();
      
      if (result.success) {
        alert('🎉 Success: ' + result.message);
      } else {
        alert('⚠️ Workflow warning: Pipeline failed to parse metadata.');
      }

    } catch (error) {
      console.error('Pipeline Connection Error:', error);
      alert('Communication Fault: Unable to verify connection stability with n8n server pipelines. Check browser console for explicit error logs.');
    }
  }
</script>
